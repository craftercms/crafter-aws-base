AWSTemplateFormatVersion: 2010-09-09
Description: Weekly EC2 Data Lifecycle Manager and authoring-data volume backup checks for the {{cluster_name}} cluster

Parameters:
  VolumeBackupReportsEnabled:
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  BackupDaysToVerify:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 7

Conditions:
  IsVolumeBackupReportsEnabled:
    !Equals [!Ref VolumeBackupReportsEnabled, true]

Resources:
  WeeklyVolumeBackupReportLambdaRole:
    Type: AWS::IAM::Role
    Condition: IsVolumeBackupReportsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: WeeklyVolumeBackupReportLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - dlm:GetLifecyclePolicies
                  - dlm:GetLifecyclePolicy
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: "arn:aws:s3:::{{ops_reports_bucket}}/*"

  WeeklyVolumeBackupReportLambda:
    Type: AWS::Lambda::Function
    Condition: IsVolumeBackupReportsEnabled
    Properties:
      Tags:
        - Key: craftercms:environment
          Value: {{environment}}
        - Key: craftercms:prod
          Value: {{prod_env}}
      FunctionName: "{{cluster_name}}-weekly-volume-backup-report-lambda"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt WeeklyVolumeBackupReportLambdaRole.Arn
      Environment:
        Variables:
          CLIENT_ID: "{{client_id}}"
          ACCOUNT_ID: !Sub "${AWS::AccountId}"
          REPORT_REGION: "{{aws_region}}"
          CLUSTER_NAME: "{{cluster_name}}"
          DLM_POLICY_DESCRIPTION: "{{cluster_name}} Kubernetes Volume Backups"
          AUTHORING_DATA_VOLUME_NAME: "{{cluster_name}}-authoring-data"
          AUTHORING_DATA_PVC_NAME: "data-authoring-*"
          KUBERNETES_CLUSTER_TAG_KEY: "kubernetes.io/cluster/{{cluster_name}}"
          BACKUP_DAYS_TO_VERIFY: !Ref BackupDaysToVerify
          OPS_REPORTS_BUCKET: "{{ops_reports_bucket}}"
          OPS_REPORTS_BUCKET_REGION: "{{ops_reports_bucket_region}}"
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timedelta, timezone

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dlm_client = boto3.client('dlm')
          ec2_client = boto3.client('ec2')

          CLIENT_ID = os.environ.get('CLIENT_ID', '')
          CLUSTER_NAME = os.environ['CLUSTER_NAME']
          DLM_POLICY_DESCRIPTION = os.environ['DLM_POLICY_DESCRIPTION']
          AUTHORING_DATA_VOLUME_NAME = os.environ['AUTHORING_DATA_VOLUME_NAME']
          AUTHORING_DATA_PVC_NAME = os.environ.get('AUTHORING_DATA_PVC_NAME', 'data-authoring-*')
          KUBERNETES_CLUSTER_TAG_KEY = os.environ['KUBERNETES_CLUSTER_TAG_KEY']
          BACKUP_DAYS_TO_VERIFY = int(os.environ.get('BACKUP_DAYS_TO_VERIFY', '7'))
          DLM_EXECUTION_WINDOW = timedelta(hours=1)


          def _paginate(method, result_key, **kwargs):
              items = []
              next_token = None
              while True:
                  call_kwargs = dict(kwargs)
                  if next_token:
                      call_kwargs['NextToken'] = next_token
                  response = method(**call_kwargs)
                  items.extend(response.get(result_key, []))
                  next_token = response.get('NextToken')
                  if not next_token:
                      break
              return items


          def find_dlm_policy():
              policies = _paginate(
                  dlm_client.get_lifecycle_policies,
                  'Policies',
                  ResourceTypes=['VOLUME'],
              )
              for policy in policies:
                  if policy.get('Description') == DLM_POLICY_DESCRIPTION:
                      policy_id = policy.get('PolicyId')
                      if not policy_id:
                          return policy
                      return dlm_client.get_lifecycle_policy(PolicyId=policy_id).get('Policy', policy)
              return None


          def dlm_retain_and_times(policy):
              retain_count = BACKUP_DAYS_TO_VERIFY
              times = []
              details = (policy or {}).get('PolicyDetails') or {}
              for schedule in details.get('Schedules') or []:
                  retain_rule = schedule.get('RetainRule') or {}
                  if retain_rule.get('Count') is not None:
                      retain_count = int(retain_rule['Count'])
                  times = (schedule.get('CreateRule') or {}).get('Times') or []
                  break
              return min(BACKUP_DAYS_TO_VERIFY, max(retain_count, 1)), times


          def find_authoring_data_volumes():
              pvc_volumes = _paginate(
                  ec2_client.describe_volumes,
                  'Volumes',
                  Filters=[
                      {'Name': f'tag:{KUBERNETES_CLUSTER_TAG_KEY}', 'Values': ['owned']},
                      {
                          'Name': 'tag:kubernetes.io/created-for/pvc/name',
                          'Values': [AUTHORING_DATA_PVC_NAME],
                      },
                  ],
              )
              if pvc_volumes:
                  return pvc_volumes
              # Fallback for volumes still named {cluster}-authoring-data-0, -1, ...
              return _paginate(
                  ec2_client.describe_volumes,
                  'Volumes',
                  Filters=[{'Name': 'tag:Name', 'Values': [f'{AUTHORING_DATA_VOLUME_NAME}*']}],
              )


          def volume_has_cluster_tag(volume):
              for tag in volume.get('Tags', []):
                  if tag.get('Key') == KUBERNETES_CLUSTER_TAG_KEY and tag.get('Value') == 'owned':
                      return True
              return False


          def get_present_snapshot_dates(volume_id):
              snapshots = _paginate(
                  ec2_client.describe_snapshots,
                  'Snapshots',
                  OwnerIds=['self'],
                  Filters=[{'Name': 'volume-id', 'Values': [volume_id]}],
              )
              dates = set()
              for snapshot in snapshots:
                  if snapshot.get('State') in ('completed', 'pending'):
                      dates.add(snapshot['StartTime'].date())
              return dates


          def scheduled_at(now, schedule_times, days_ago=0):
              if not schedule_times:
                  return None
              parts = str(schedule_times[0]).split(':')
              hour = int(parts[0])
              minute = int(parts[1]) if len(parts) > 1 else 0
              start = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
              return start - timedelta(days=days_ago)


          def expected_backup_days(now, verify_days, schedule_times, snapshot_dates, created_at=None):
              scheduled_today = scheduled_at(now, schedule_times)
              start_offset = 0
              # DLM starts within an hour of the scheduled time, so today only counts
              # once its snapshot exists or that window has passed.
              if (
                  scheduled_today
                  and now < scheduled_today + DLM_EXECUTION_WINDOW
                  and now.date() not in snapshot_dates
              ):
                  start_offset = 1
              if created_at:
                  created_at = created_at.astimezone(timezone.utc)
              days = []
              for days_ago in range(start_offset, start_offset + verify_days):
                  day = now.date() - timedelta(days=days_ago)
                  if created_at:
                      scheduled_day = scheduled_at(now, schedule_times, days_ago)
                      if scheduled_day is not None:
                          if scheduled_day < created_at:
                              continue
                      elif day < created_at.date():
                          continue
                  days.append(day)
              return days


          def missing_backup_days(snapshot_dates, verify_days, schedule_times, created_at=None):
              now = datetime.now(timezone.utc)
              expected = expected_backup_days(
                  now, verify_days, schedule_times, snapshot_dates, created_at
              )
              return [day.isoformat() for day in expected if day not in snapshot_dates], expected


          def check_dlm_policy():
              empty = {
                  'ok': False,
                  'findings': [],
                  'errors': [],
                  'retain_count': BACKUP_DAYS_TO_VERIFY,
                  'schedule_times': [],
              }
              try:
                  policy = find_dlm_policy()
              except Exception as exc:
                  logger.exception('Failed to list DLM policies')
                  empty['errors'] = [f"Failed to list DLM policies: {exc}"]
                  return empty
              if not policy:
                  empty['findings'] = [f"DLM policy not found: `{DLM_POLICY_DESCRIPTION}`"]
                  return empty
              retain_count, schedule_times = dlm_retain_and_times(policy)
              state = policy.get('State', 'UNKNOWN')
              if state != 'ENABLED':
                  return {
                      'ok': False,
                      'findings': [
                          f"DLM policy `{DLM_POLICY_DESCRIPTION}` state is `{state}` (expected ENABLED)"
                      ],
                      'errors': [],
                      'retain_count': retain_count,
                      'schedule_times': schedule_times,
                  }
              return {
                  'ok': True,
                  'findings': [],
                  'errors': [],
                  'retain_count': retain_count,
                  'schedule_times': schedule_times,
              }


          def check_authoring_data_volumes(dlm_result):
              try:
                  volumes = find_authoring_data_volumes()
              except Exception as exc:
                  logger.exception('Failed to describe authoring-data volumes')
                  return {
                      'ok': False,
                      'findings': [],
                      'errors': [f"Failed to describe volumes: {exc}"],
                      'volumes': [],
                      'verify_days': dlm_result.get('retain_count', BACKUP_DAYS_TO_VERIFY),
                  }
              if not volumes:
                  return {
                      'ok': False,
                      'findings': [
                          f"No authoring-data volume found "
                          f"(cluster tag `{KUBERNETES_CLUSTER_TAG_KEY}=owned` with PVC "
                          f"`{AUTHORING_DATA_PVC_NAME}`, or Name `{AUTHORING_DATA_VOLUME_NAME}*`)"
                      ],
                      'errors': [],
                      'volumes': [],
                      'verify_days': dlm_result.get('retain_count', BACKUP_DAYS_TO_VERIFY),
                  }

              findings = []
              checked_volumes = []
              verify_days = dlm_result.get('retain_count', BACKUP_DAYS_TO_VERIFY)
              schedule_times = dlm_result.get('schedule_times') or []
              check_snapshots = dlm_result.get('ok', False)
              for volume in volumes:
                  volume_id = volume['VolumeId']
                  checked_volumes.append(volume_id)
                  if not volume_has_cluster_tag(volume):
                      findings.append(
                          f"Volume `{volume_id}` (`{AUTHORING_DATA_VOLUME_NAME}`) is missing tag "
                          f"`{KUBERNETES_CLUSTER_TAG_KEY}=owned`"
                      )
                  if not check_snapshots:
                      continue
                  try:
                      missing_days, expected = missing_backup_days(
                          get_present_snapshot_dates(volume_id),
                          verify_days,
                          schedule_times,
                          volume.get('CreateTime'),
                      )
                  except Exception as exc:
                      logger.exception('Failed to list snapshots for %s', volume_id)
                      return {
                          'ok': False,
                          'findings': findings,
                          'errors': [f"Failed to list snapshots for `{volume_id}`: {exc}"],
                          'volumes': checked_volumes,
                          'verify_days': verify_days,
                      }
                  if missing_days:
                      findings.append(
                          f"Volume `{volume_id}` is missing snapshots for "
                          f"{len(missing_days)} of {len(expected)} retained day(s): "
                          f"{', '.join(missing_days)}"
                      )

              return {
                  'ok': not findings,
                  'findings': findings,
                  'errors': [],
                  'volumes': checked_volumes,
                  'verify_days': verify_days,
              }


          def digest_period():
              now = datetime.now(timezone.utc)
              year, week, _ = now.isocalendar()
              return f'{year}-W{week:02d}'


          def put_summary(summary):
              bucket = os.environ.get('OPS_REPORTS_BUCKET', '')
              if not bucket or '{{' in bucket:
                  logger.warning('OPS_REPORTS_BUCKET unset; skip S3 upload')
                  return True
              region = os.environ.get('OPS_REPORTS_BUCKET_REGION', 'us-east-1')
              report_region = summary.get('region') or ''
              if not report_region:
                  logger.warning('REPORT_REGION unset; skip S3 upload')
                  return False
              key = (
                  f"{summary['period']}/{summary['client']}/"
                  f"{summary['cluster']}/{report_region}/"
                  f"{summary['report_type']}.json"
              )
              try:
                  boto3.client('s3', region_name=region).put_object(
                      Bucket=bucket,
                      Key=key,
                      Body=json.dumps(summary, default=str),
                      ContentType='application/json',
                      ServerSideEncryption='AES256',
                  )
                  logger.info('Uploaded %s', key)
                  return True
              except Exception as exc:
                  logger.exception('Failed to upload %s: %s', key, exc)
                  return False


          def build_summary(dlm_result, volume_result):
              errors = dlm_result.get('errors', []) + volume_result.get('errors', [])
              findings = dlm_result.get('findings', []) + volume_result.get('findings', [])
              items = []
              for finding in findings:
                  items.append({'name': 'volume_backup', 'status': 'fail', 'detail': finding})
              for err in errors:
                  items.append({'name': 'check_error', 'status': 'fail', 'detail': err})
              if findings or errors:
                  status = 'fail'
              else:
                  status = 'ok'
              return {
                  'schema_version': 1,
                  'client': CLIENT_ID,
                  'account_id': os.environ.get('ACCOUNT_ID', ''),
                  'cluster': CLUSTER_NAME,
                  'region': os.environ.get('REPORT_REGION', os.environ.get('AWS_REGION', os.environ.get('AWS_DEFAULT_REGION', ''))),
                  'report_type': 'volume_backup',
                  'generated_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'period': digest_period(),
                  'status': status,
                  'counts': {
                      'fail': len([i for i in items if i['status'] == 'fail']),
                      'warn': len([i for i in items if i['status'] == 'warn']),
                  },
                  'items': items,
              }


          def handler(event, context):
              logger.info('Running weekly volume backup report for cluster %s', CLUSTER_NAME)
              dlm_result = check_dlm_policy()
              volume_result = check_authoring_data_volumes(dlm_result)
              summary = build_summary(dlm_result, volume_result)
              uploaded = put_summary(summary)
              logger.info(
                  'Volume backup report status=%s (weekly digest)',
                  summary['status'],
              )
              if not uploaded:
                  raise RuntimeError('Failed to upload volume backup report summary')
              return {'statusCode': 200, 'body': json.dumps(summary, default=str)}

  WeeklyVolumeBackupReportLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsVolumeBackupReportsEnabled
    DependsOn: WeeklyVolumeBackupReportScheduleRule
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WeeklyVolumeBackupReportLambda
      Principal: events.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/{{cluster_name}}-WeeklyVolumeBackupReportSchedule"

  WeeklyVolumeBackupReportScheduleRule:
    Type: AWS::Events::Rule
    Condition: IsVolumeBackupReportsEnabled
    Properties:
      Name: "{{cluster_name}}-WeeklyVolumeBackupReportSchedule"
      Description: Weekly DLM and authoring-data volume backup check for cluster {{cluster_name}} (Wed 11:00 AM ET / 15:00 UTC)
      ScheduleExpression: cron(0 15 ? * WED *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt WeeklyVolumeBackupReportLambda.Arn
          Id: WeeklyVolumeBackupReportLambdaTarget

Outputs:
  WeeklyVolumeBackupReportLambdaArn:
    Condition: IsVolumeBackupReportsEnabled
    Value: !GetAtt WeeklyVolumeBackupReportLambda.Arn
