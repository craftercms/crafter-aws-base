AWSTemplateFormatVersion: 2010-09-09
Description: Additional AWS resources for the {{cluster_name}} cluster

Parameters:
  VpcId:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  PrivateRouteTableIds:
    Type: CommaDelimitedList
  OpenSearchVersion:
    Type: String
    AllowedValues: ['OpenSearch_3.3', 'OpenSearch_3.1', 'OpenSearch_2.19', 'OpenSearch_2.17', 'OpenSearch_2.15', 'OpenSearch_2.13', 'OpenSearch_2.11', 'OpenSearch_2.9','OpenSearch_2.7', 'OpenSearch_2.5', 'OpenSearch_2.3', 'OpenSearch_1.3']
    Default: 'OpenSearch_3.3'
  OpenSearchSingleNodeCluster:
    Type: String
    Default: false
  OpenSearchInstanceType:
    Type: String
    Default: 'm5.large.search'
  OpenSearchVolumeSize:
    Type: Number
    Default: 20
  BackupRegion:
    Type: String
    Default: ''
    AllowedValues:
      - ''
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - ca-central-1
      - ap-south-1
      - ap-northeast-2
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - eu-central-1
      - eu-west-1
      - eu-west-2
      - sa-east-1
  BackupRegionBucketNamePrefix:
    Type: String
    Default: ''
  BastionInstanceType:
    Type: String
    Default: t3.micro
  BastionUsers:
    Type: String
    Default: 'alfonso steven sumer russ'
    AllowedPattern: '^[a-z][a-z0-9_-]*( [a-z][a-z0-9_-]*)*$'
    ConstraintDescription: 'Space-separated lowercase usernames starting with a letter, containing only letters, digits, underscores, and hyphens'
  BastionAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      AMI for the bastion host. Resolved from the AL2023 public SSM parameter when the stack is
      created, then kept with UsePreviousValue on later updates. An SSM parameter type or an
      unversioned resolve:ssm reference would be re-resolved on every update and replace the
      instance, losing local users, host keys and the private IP.
  BastionPatchScheduleExpression:
    Type: String
    Default: 'cron(0 1 ? * MON *)'
    Description: >-
      Weekly SSM Patch Manager schedule in UTC. Default is Monday 01:00 UTC: Sunday 9 PM EDT
      during daylight saving, Sunday 8 PM EST during standard time. SSM Association has no
      timezone, so this cannot stay at 9 PM ET year round. The run still sits inside the
      Sunday 9 to 11 PM ET alarm blackout (Monday UTC hours 1 to 4), which already covers
      both DST offsets.
  OpenSearchSoftwareAutoUpdateEnabled:
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
    Description: >-
      When true, queue OpenSearch service software updates during Sunday maintenance
      (software patch only, never engine upgrade).
  AuthoringWebAclEnabled:
    Type: String
    Default: true
    AllowedValues:
      - true
      - false

Conditions:
  UseBackupRegion:
    !And [!Not [!Equals [!Ref BackupRegion, '']], !Not [!Equals [!Ref BackupRegionBucketNamePrefix, '']]]
  IsOpenSearchSingleNodeCluster:
    !Equals [true, !Ref OpenSearchSingleNodeCluster]
  OpenSearchSoftwareAutoUpdateEnabled:
    !Equals [true, !Ref OpenSearchSoftwareAutoUpdateEnabled]
  AuthoringWebAclEnabled:
    !Equals [true, !Ref AuthoringWebAclEnabled]

Resources:
# S3 Log-forwarding config
  # ClusterLogsBucket:
  #   DeletionPolicy: Retain
  #   Type: AWS::S3::Bucket
  #   Properties:
  #     BucketName: {{cluster_logs_s3_bucket_name}}
  #     OwnershipControls:
  #       Rules:
  #         - ObjectOwnership: BucketOwnerPreferred
  #     PublicAccessBlockConfiguration:
  #       BlockPublicAcls: true
  #       IgnorePublicAcls: true
  #       BlockPublicPolicy: true
  #       RestrictPublicBuckets: true

  AuthoringNodeGroupSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: {{cluster_name}}-authoring-nodegroup-sg
        GroupDescription: sg for authoring nodegroup in {{cluster_name}} to grant access to authoring loadblancer only
        VpcId: !Ref VpcId
        SecurityGroupIngress:
          - FromPort: '8080'
            IpProtocol: tcp
            ToPort: '8080'
            SourceSecurityGroupId: !Ref AuthoringBackendSecurityGroup
        SecurityGroupEgress:
          - IpProtocol: -1
            FromPort: 0
            ToPort: 0
            CidrIp: 0.0.0.0/0

  AuthoringBackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-authoring-backend-sg
      GroupDescription: Backend sg for authoring LB in {{cluster_name}}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  AuthoringFrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-authoring-frontend-sg
      GroupDescription: Frontend sg for authoring LB in {{cluster_name}}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - FromPort: '80'
          IpProtocol: tcp
          ToPort: '80'
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  DeliveryNodeGroupSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: {{cluster_name}}-delivery-nodegroup-sg
        GroupDescription: sg for delivery nodegroup in {{cluster_name}} to grant access to delivery loadblancer only
        VpcId: !Ref VpcId
        SecurityGroupIngress:
          - FromPort: '8080'
            IpProtocol: tcp
            ToPort: '8080'
            SourceSecurityGroupId: !Ref DeliveryBackendSecurityGroup
        SecurityGroupEgress:
          - IpProtocol: -1
            FromPort: 0
            ToPort: 0
            CidrIp: 0.0.0.0/0

  DeliveryBackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-delivery-backend-sg
      GroupDescription: Backend sg for delivery LB in {{cluster_name}}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  DeliveryFrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-delivery-frontend-sg
      GroupDescription: Frontend sg for delivery LB in {{cluster_name}}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - FromPort: '80'
          IpProtocol: tcp
          ToPort: '80'
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  AuthoringWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: AuthoringWebAclEnabled
    Properties:
      Description: Bot control WebACL for Authoring in the {{cluster_name}} cluster
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: AllowedRequests
        SampledRequestsEnabled: true 
      DefaultAction: 
        Allow: {}
      Scope:
        "REGIONAL"
      Rules: 
        - Name: layer-7-anti-ddos
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAntiDDoSRuleSet
              ManagedRuleGroupConfigs:
                - AWSManagedRulesAntiDDoSRuleSet:
                    SensitivityToBlock: LOW
                    ClientSideActionConfig:
                      Challenge:
                        UsageOfAction: DISABLED
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: layer-7-anti-ddos
            SampledRequestsEnabled: true
        - Name: bot-control-rules
          OverrideAction:
            None: {}
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesBotControlRuleSet
              ManagedRuleGroupConfigs:
                - AWSManagedRulesBotControlRuleSet:
                    EnableMachineLearning: false
                    InspectionLevel: COMMON
              RuleActionOverrides:
                - Name: CategoryMonitoring
                  ActionToUse:
                    Count: {}
                - Name: SignalNonBrowserUserAgent
                  ActionToUse:
                    Count: {}
                - Name: CategoryHttpLibrary
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: bot-control-rules
            SampledRequestsEnabled: true
        - Name: global-rate-limit
          Priority: 2
          Action:
            Count: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: global-rate-limit
            SampledRequestsEnabled: true
        # CRS and SQLi are omitted on Authoring: Studio content and configuration
        # writes routinely trip body inspection (XSS, SQLi, EC2 SSRF, size limits)
        # as authored payload, and overrides plus path exceptions end up with
        # little real coverage left. Delivery keeps those rule groups.

  GuardDutyEndPoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      PrivateDnsEnabled: True
      SecurityGroupIds:
          - !Ref GuardDutySecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.guardduty-data"
      SubnetIds: !Ref PrivateSubnetIds
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Action": "*",
              "Resource": "*",
              "Effect": "Allow",
              "Principal": "*"
            },
            {
              "Condition": {
                "StringNotEquals": {
                  "aws:PrincipalAccount": "${AWS::AccountId}" 
                }
              },
              "Action": "*",
              "Resource": "*",
              "Effect": "Deny",
              "Principal": "*"
            }
          ]
        }
        
  GuardDutySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "GuardDuty security group"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 0.0.0.0/32

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      RouteTableIds: !Ref PrivateRouteTableIds
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref VpcId

  BastionEICESecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-bastion-eice-sg
      GroupDescription: Security group for EC2 Instance Connect Endpoint in {{cluster_name}}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: {{cluster_name}}-bastion-sg
      GroupDescription: Security group for bastion host in {{cluster_name}} - SSH from EC2 Instance Connect Endpoint only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionEICESecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: {{cluster_name}}-bastion-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: {{cluster_name}}-bastion-instance-profile
      Roles:
        - !Ref BastionRole

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref BastionAmiId
      InstanceType: !Ref BastionInstanceType
      SubnetId: !Select [0, !Ref PrivateSubnetIds]
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      IamInstanceProfile: !Ref BastionInstanceProfile
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          yum update -y
          yum install -y ec2-instance-connect
          for user in ${BastionUsers}; do
            username=$(echo "$user" | tr '[:upper:]' '[:lower:]')
            id "$username" >/dev/null 2>&1 || useradd -m -s /bin/bash "$username"
            passwd -l "$username" || true
            mkdir -p "/home/$username/.ssh"
            chmod 700 "/home/$username/.ssh"
            chown "$username:$username" "/home/$username/.ssh"
            echo "$username ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/$username"
            chmod 440 "/etc/sudoers.d/$username"
          done
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
          sed -i 's/^#\?ChallengeResponseAuthentication.*/ChallengeResponseAuthentication no/' /etc/ssh/sshd_config
          sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          systemctl restart sshd
      Tags:
        - Key: Name
          Value: {{cluster_name}}-bastion
        - Key: craftercms:environment
          Value: {{environment}}
        - Key: craftercms:prod
          Value: {{prod_env}}
        - Key: Patch Group
          Value: {{cluster_name}}-bastion

  BastionPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Name: {{cluster_name}}-bastion-patch-baseline
      Description: >-
        Bastion only. Approves AL2023 Security Critical, Important, Medium, and Low,
        plus Bugfix, with no waiting period. Not the account default, so EKS nodes
        keep the AWS default baseline.
      OperatingSystem: AMAZON_LINUX_2023
      DefaultBaseline: false
      RejectedPatchesAction: ALLOW_AS_DEPENDENCY
      PatchGroups:
        - {{cluster_name}}-bastion
      ApprovalRules:
        PatchRules:
          - ApproveAfterDays: 0
            ComplianceLevel: CRITICAL
            EnableNonSecurity: false
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Security
                - Key: SEVERITY
                  Values:
                    - Critical
                    - Important
                    - Medium
                    - Low
          - ApproveAfterDays: 0
            ComplianceLevel: MEDIUM
            EnableNonSecurity: false
            PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Bugfix

  BastionPatchAssociation:
    Type: AWS::SSM::Association
    Properties:
      ApplyOnlyAtCronInterval: true
      AssociationName: {{cluster_name}}-bastion-weekly-patch
      Name: AWS-RunPatchBaseline
      ScheduleExpression: !Ref BastionPatchScheduleExpression
      Parameters:
        Operation:
          - Install
        RebootOption:
          - RebootIfNeeded
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref BastionInstance

  BastionInstanceConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      SubnetId: !Select [0, !Ref PrivateSubnetIds]
      SecurityGroupIds:
        - !Ref BastionEICESecurityGroup
      Tags:
        - Key: Name
          Value: {{cluster_name}}-bastion-eice
        - Key: craftercms:environment
          Value: {{environment}}
        - Key: craftercms:prod
          Value: {{prod_env}}
        
  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows access to OpenSearch domains from the nodes of the {{cluster_name}} cluster"
      VpcId: !Ref VpcId
      GroupName: "{{cluster_name}}-es-sg"
      SecurityGroupIngress:
        - FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
          SourceSecurityGroupId: !Ref AuthoringNodeGroupSecurityGroup
        - FromPort: '443'
          IpProtocol: tcp
          ToPort: '443'
          SourceSecurityGroupId: !Ref DeliveryNodeGroupSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0

  BastionOpenSearchIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OpenSearchSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: '{{cluster_name}}-opensearch'
      EngineVersion: !Ref OpenSearchVersion
      EncryptionAtRestOptions:
        Enabled: true
      ClusterConfig:
        DedicatedMasterEnabled: false
        InstanceCount: !If [IsOpenSearchSingleNodeCluster, '1', '3']
        ZoneAwarenessEnabled: !If [IsOpenSearchSingleNodeCluster, 'false', 'true']
        ZoneAwarenessConfig:
          !If
          - IsOpenSearchSingleNodeCluster
          - !Ref 'AWS::NoValue'
          - AvailabilityZoneCount: "3"
        InstanceType: !Ref OpenSearchInstanceType
        MultiAZWithStandbyEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: !Ref OpenSearchVolumeSize
        VolumeType: "gp3"
      AccessPolicies:
        Version: 2012-10-17
        Statement:
          - Effect: "Allow"
            Principal: "*"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/{{cluster_name}}-opensearch/*"
      AdvancedOptions:
        rest.action.multi.allow_explicit_index: 'true'
        indices.query.bool.max_clause_count: '8192'
      VPCOptions:
        SubnetIds:
          !If
          - IsOpenSearchSingleNodeCluster
          - 
            - !Select [0, !Ref PrivateSubnetIds] 
          - !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref OpenSearchSecurityGroup

  # Sunday maintenance: queue OpenSearch service software patches only (never engine upgrade).
  # Does not modify OpenSearchDomain properties. cron(0 3 ? * MON *) UTC = Sunday 11:00 PM ET
  # during EDT / 10:00 PM ET during EST, after node upgrades start (9:00 PM ET) and still
  # inside the #915 blackout window.
  OpenSearchSoftwareUpdateLambdaRole:
    Type: AWS::IAM::Role
    Condition: OpenSearchSoftwareAutoUpdateEnabled
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: OpenSearchSoftwareUpdateLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - es:DescribeDomain
                  - es:DescribeElasticsearchDomain
                  - es:StartServiceSoftwareUpdate
                Resource:
                  - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/{{cluster_name}}-opensearch"
                  - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/{{cluster_name}}-opensearch/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: "arn:aws:s3:::{{ops_reports_bucket}}/*"

  OpenSearchSoftwareUpdateLambda:
    Type: AWS::Lambda::Function
    Condition: OpenSearchSoftwareAutoUpdateEnabled
    Properties:
      Tags:
        - Key: craftercms:environment
          Value: {{environment}}
        - Key: craftercms:prod
          Value: {{prod_env}}
      FunctionName: "{{cluster_name}}-opensearch-software-update-lambda"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt OpenSearchSoftwareUpdateLambdaRole.Arn
      Environment:
        Variables:
          CLIENT_ID: "{{client_id}}"
          ACCOUNT_ID: !Sub "${AWS::AccountId}"
          REPORT_REGION: "{{aws_region}}"
          OPENSEARCH_DOMAIN_NAME: "{{cluster_name}}-opensearch"
          EKS_CLUSTER_NAME: "{{cluster_name}}"
          OPS_REPORTS_BUCKET: "{{ops_reports_bucket}}"
          OPS_REPORTS_BUCKET_REGION: "{{ops_reports_bucket_region}}"
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timezone

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          os_client = boto3.client('opensearch')

          CLIENT_ID = os.environ.get('CLIENT_ID', '')
          OPENSEARCH_DOMAIN_NAME = os.environ['OPENSEARCH_DOMAIN_NAME']
          EKS_CLUSTER_NAME = os.environ['EKS_CLUSTER_NAME']
          IN_PROGRESS_STATUSES = {'PENDING_UPDATE', 'IN_PROGRESS'}


          def digest_period():
              now = datetime.now(timezone.utc)
              year, week, _ = now.isocalendar()
              return f'{year}-W{week:02d}'


          def put_summary(summary):
              bucket = os.environ.get('OPS_REPORTS_BUCKET', '')
              if not bucket or '{{' in bucket:
                  logger.warning('OPS_REPORTS_BUCKET unset; skip S3 upload')
                  return True
              report_region = summary.get('region') or ''
              if not report_region:
                  logger.warning('REPORT_REGION unset; skip S3 upload')
                  return False
              region = os.environ.get('OPS_REPORTS_BUCKET_REGION', 'us-east-1')
              key = (
                  f"{summary['period']}/{summary['client']}/"
                  f"{summary['cluster']}/{report_region}/"
                  f"{summary['report_type']}.json"
              )
              try:
                  boto3.client('s3', region_name=region).put_object(
                      Bucket=bucket,
                      Key=key,
                      Body=json.dumps(summary, default=str),
                      ContentType='application/json',
                      ServerSideEncryption='AES256',
                  )
                  logger.info('Uploaded %s', key)
                  return True
              except Exception as exc:
                  logger.exception('Failed to upload %s: %s', key, exc)
                  return False


          def build_summary(result):
              items = [{
                  'name': 'opensearch_software',
                  'status': result['item_status'],
                  'detail': result['detail'],
              }]
              return {
                  'schema_version': 1,
                  'client': CLIENT_ID,
                  'account_id': os.environ.get('ACCOUNT_ID', ''),
                  'cluster': EKS_CLUSTER_NAME,
                  'region': os.environ.get(
                      'REPORT_REGION',
                      os.environ.get('AWS_REGION', os.environ.get('AWS_DEFAULT_REGION', '')),
                  ),
                  'report_type': 'opensearch_software_update',
                  'generated_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'period': digest_period(),
                  'status': result['status'],
                  'counts': {
                      'fail': len([i for i in items if i['status'] == 'fail']),
                      'warn': len([i for i in items if i['status'] == 'warn']),
                  },
                  'items': items,
                  'action': result['action'],
                  'engine_version': result.get('engine_version'),
              }


          def apply_software_update(domain_name):
              response = os_client.describe_domain(DomainName=domain_name)
              domain = response['DomainStatus']
              engine_version = domain.get('EngineVersion', 'Unknown')
              opts = domain.get('ServiceSoftwareOptions', {})
              update_available = bool(opts.get('UpdateAvailable', False))
              update_status = opts.get('UpdateStatus', '') or ''
              current_version = opts.get('CurrentVersion', 'Unknown')
              new_version = opts.get('NewVersion', '')
              processing = bool(domain.get('Processing', False))

              base = {
                  'engine_version': engine_version,
                  'current_version': current_version,
                  'new_version': new_version,
                  'update_status': update_status,
                  'processing': processing,
              }

              if processing:
                  return {
                      **base,
                      'action': 'skip_processing',
                      'status': 'ok',
                      'item_status': 'ok',
                      'detail': (
                          f"Domain is Processing; left software at `{current_version}` "
                          f"(engine `{engine_version}` unchanged)"
                      ),
                  }

              if update_status in IN_PROGRESS_STATUSES:
                  return {
                      **base,
                      'action': 'skip_in_progress',
                      'status': 'ok',
                      'item_status': 'ok',
                      'detail': (
                          f"Update already `{update_status}`: `{current_version}`"
                          + (f" -> `{new_version}`" if new_version else '')
                          + f" (engine `{engine_version}` unchanged)"
                      ),
                  }

              if not update_available:
                  return {
                      **base,
                      'action': 'skip_up_to_date',
                      'status': 'ok',
                      'item_status': 'ok',
                      'detail': (
                          f"No service software update available "
                          f"(`{current_version}`, engine `{engine_version}`)"
                      ),
                  }

              update_response = os_client.start_service_software_update(
                  DomainName=domain_name,
                  ScheduleAt='NOW',
              )
              started = update_response.get('ServiceSoftwareOptions', {})
              started_status = started.get('UpdateStatus', update_status)
              started_new = started.get('NewVersion', new_version)
              return {
                  **base,
                  'action': 'started',
                  'status': 'ok',
                  'item_status': 'ok',
                  'update_status': started_status,
                  'new_version': started_new,
                  'detail': (
                      f"Queued service software update `{current_version}`"
                      + (f" -> `{started_new}`" if started_new else '')
                      + f" (Status: {started_status}; engine `{engine_version}` unchanged)"
                  ),
              }


          def handler(event, context):
              logger.info(
                  'OpenSearch software update check for domain %s (software only)',
                  OPENSEARCH_DOMAIN_NAME,
              )
              try:
                  result = apply_software_update(OPENSEARCH_DOMAIN_NAME)
              except Exception as exc:
                  logger.exception('OpenSearch software update failed: %s', exc)
                  result = {
                      'action': 'error',
                      'status': 'fail',
                      'item_status': 'fail',
                      'engine_version': None,
                      'detail': str(exc),
                  }
              summary = build_summary(result)
              uploaded = put_summary(summary)
              logger.info(
                  'OpenSearch software update action=%s status=%s',
                  result['action'],
                  summary['status'],
              )
              if not uploaded:
                  raise RuntimeError('Failed to upload OpenSearch software update summary')
              if result['action'] == 'error':
                  raise RuntimeError(result['detail'])
              return {'statusCode': 200, 'body': json.dumps(summary, default=str)}

  OpenSearchSoftwareUpdateLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: OpenSearchSoftwareAutoUpdateEnabled
    DependsOn: OpenSearchSoftwareUpdateScheduleRule
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OpenSearchSoftwareUpdateLambda
      Principal: events.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/{{cluster_name}}-OpenSearchSoftwareUpdateSchedule"

  OpenSearchSoftwareUpdateScheduleRule:
    Type: AWS::Events::Rule
    Condition: OpenSearchSoftwareAutoUpdateEnabled
    Properties:
      Name: "{{cluster_name}}-OpenSearchSoftwareUpdateSchedule"
      Description: Sunday OpenSearch service software update for cluster {{cluster_name}} (Sun 11:00 PM ET / Mon 03:00 UTC during EDT; software patch only)
      ScheduleExpression: cron(0 3 ? * MON *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt OpenSearchSoftwareUpdateLambda.Arn
          Id: OpenSearchSoftwareUpdateLambdaTarget

  KuberVolumeLifecyclePolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: "{{cluster_name}} Kubernetes Volume Backups"
      State: "ENABLED"
      ExecutionRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/AWSDataLifecycleManagerDefaultRole"
      PolicyDetails:
        ResourceTypes:
          - "VOLUME"
        TargetTags:
          - Key: "kubernetes.io/cluster/{{cluster_name}}"
            Value: "owned"
        Schedules:
          - Name: "Daily Backup"
            CreateRule:
              Interval: 24
              IntervalUnit: "HOURS"
              Times:
                - "{{kuber_volume_daily_backup_time_utc}}"
            RetainRule:
              Count: 7
            CopyTags: true
            CrossRegionCopyRules:
              !If
              - UseBackupRegion
              - 
                - Target: !Ref BackupRegion              
                  Encrypted: false
                  CopyTags: true
                  RetainRule:
                    Interval: 7
                    IntervalUnit: "DAYS"    
              - !Ref 'AWS::NoValue'

  S3BackupBucketLambdaRole:
    Type: AWS::IAM::Role
    Condition: UseBackupRegion
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: S3BackupBucketLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:PutBucketTagging
                Resource: !Sub "arn:aws:s3:::${BackupRegionBucketNamePrefix}-*"

  S3BackupBucketLambda:
    Type: AWS::Lambda::Function
    Condition: UseBackupRegion
    Properties:
      Tags:
        - Key: craftercms:environment
          Value: {{environment}}
        - Key: craftercms:prod
          Value: {{prod_env}}
      FunctionName: "{{cluster_name}}-s3-backup-bucket-lambda"
      Runtime: python3.13
      Role: !GetAtt S3BackupBucketLambdaRole.Arn
      Handler: index.handler
      Timeout: 30
      Code:
        ZipFile: |
          import cfnresponse
          import logging
          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          class BackupBucketSetupException(Exception):
              pass

          def normalize_tags(raw_tags):
              """
              Accepts either:
                - CloudFormation-style list of {Key, Value}
                - dict of key -> value
              Returns a dict
              """
              if not raw_tags:
                  return {}

              if isinstance(raw_tags, list):
                  return {t['Key']: t['Value'] for t in raw_tags}

              if isinstance(raw_tags, dict):
                  return raw_tags

              raise ValueError("Unsupported Tags format")

          def handler(event, context):
              bucket_name = 'unknown'
              try:
                  props = event['ResourceProperties']
                  bucket_name = props['BackupBucketName']
                  bucket_region = props['BackupBucketRegion']
                  enable_versioning = str(props.get('EnableVersioning', 'false')).lower() == 'true'
                  tags = normalize_tags(props.get('Tags'))

                  if event['RequestType'] in ('Create', 'Update'):
                      client = boto3.client('s3', region_name=bucket_region)

                      # Create bucket if it doesn't exist
                      try:
                          if bucket_region == 'us-east-1':
                              client.create_bucket(Bucket=bucket_name)
                          else:
                              client.create_bucket(
                                  Bucket=bucket_name,
                                  CreateBucketConfiguration={'LocationConstraint': bucket_region}
                              )
                          logger.info("Created bucket '%s'", bucket_name)
                      except ClientError as error:
                          if error.response['Error']['Code'] == 'BucketAlreadyOwnedByYou':
                              logger.warning("Bucket '%s' already exists! Using it", bucket_name)
                          else:
                              raise

                      # Block all public access
                      client.put_public_access_block(
                          Bucket=bucket_name,
                          PublicAccessBlockConfiguration={
                              'BlockPublicAcls': True,
                              'IgnorePublicAcls': True,
                              'BlockPublicPolicy': True,
                              'RestrictPublicBuckets': True
                          }
                      )
                      logger.info("Blocked all public access to bucket '%s'", bucket_name)

                      # Enable versioning if requested
                      if enable_versioning:
                          client.put_bucket_versioning(
                              Bucket=bucket_name,
                              VersioningConfiguration={'Status': 'Enabled'}
                          )
                          logger.info("Enabled versioning on bucket '%s'", bucket_name)
                      else:
                          logger.info("Versioning not enabled on bucket '%s'", bucket_name)

                      # Apply tags if provided
                      if tags:
                          tag_set = [{'Key': k, 'Value': v} for k, v in tags.items()]
                          client.put_bucket_tagging(
                              Bucket=bucket_name,
                              Tagging={'TagSet': tag_set}
                          )
                          logger.info("Applied tags to bucket '%s': %s", bucket_name, tags)

                      logger.info("Setup of backup bucket '%s' complete", bucket_name)

                      response_data = {
                          'Name': bucket_name,
                          'Arn': f"arn:aws:s3:::{bucket_name}"
                      }
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data, bucket_name)

                  elif event['RequestType'] == 'Delete':
                      logger.info("Please delete the '%s' backup bucket", bucket_name)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, bucket_name)

              except Exception as error:
                  logger.exception("Error when setting up backup bucket '%s'", bucket_name)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(error)})

