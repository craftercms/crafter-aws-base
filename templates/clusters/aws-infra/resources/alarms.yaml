  OSIndexingLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CloudWatchAlarmsEnabled
    Properties:
      AlarmName: {{client_id}}/{{cluster_name}}/os-indexing-latency-alarm
      AlarmDescription: OS cluster indexing latency in {{client_id}}/{{cluster_name}}  > 80 millisec
      Metrics:
        - Expression: !Sub "IF((DAY(m1) == ${BlackoutWindowDay} AND (HOUR(m1) >= ${BlackoutWindowStartHour} AND HOUR(m1) <= ${BlackoutWindowEndHour})), 1, m1)"
          Id: indexing_latency
          Period: '60'
          ReturnData: True
        - Id: m1
          ReturnData: False
          MetricStat:
            Metric:
              Dimensions:
                - Name: DomainName
                  Value: {{cluster_name}}-opensearch
                - Name: ClientId
                  Value: !Sub '${AWS::AccountId}'
              MetricName: IndexingLatency
              Namespace: AWS/ES
            Period: '60'
            Stat: Average
      EvaluationPeriods: '1'
      ComparisonOperator: GreaterThanThreshold
      Threshold: '80'
      TreatMissingData: "breaching"
      AlarmActions:
        - !Ref AlarmsNotificationSNSTopic
      OKActions: 
        - !Ref AlarmsNotificationSNSTopic

  OSSearchLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CloudWatchAlarmsEnabled
    Properties:
      AlarmName: {{client_id}}/{{cluster_name}}/os-search-latency-alarm
      AlarmDescription: OS cluster search latency in {{client_id}}/{{cluster_name}}  > 50 millisec
      Metrics:
        - Expression: !Sub "IF((DAY(m1) == ${BlackoutWindowDay} AND (HOUR(m1) >= ${BlackoutWindowStartHour} AND HOUR(m1) <= ${BlackoutWindowEndHour})), 1, m1)"
          Id: search_latency
          Period: '60'
          ReturnData: True
        - Id: m1
          ReturnData: False
          MetricStat:
            Metric:
              Dimensions:
                - Name: DomainName
