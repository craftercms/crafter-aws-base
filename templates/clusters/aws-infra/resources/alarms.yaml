AWSTemplateFormatVersion: 2010-09-09
Description: AWS alarms for the {{cluster_name}} cluster

Parameters:
  CloudWatchAlarmsEnabled:
    Type: String
    Default: true
  AlarmsSlackChannelHookUrl:
    Type: String
    NoEcho: true
    Default: ''
  AlarmsEmailAddress:
    Type: String
  PagerDutyIntegrationUrl:
    Type: String
    NoEcho: true
    Default: ''
  BlackoutWindowDay:
    Type: String
    Default: 7
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
  BlackoutWindowStartHour:
    Type: String
    Default: 16
  BlackoutWindowEndHour:
    Type: String
    Default: 17
  LoadBalancerAlarmsEnabled:
    Type: String
    Default: false
  DeliveryInstanceCount:
    Type: String
    Default: '{{delivery_instance_count}}'

Conditions:
  CloudWatchAlarmsEnabled:
    !Equals [!Ref CloudWatchAlarmsEnabled, true]
  PagerDutyIntegrationUrlSpecified:
    !Not [!Equals [!Ref PagerDutyIntegrationUrl, '']]
  AlarmsSlackChannelHookUrlSpecified:
    !Not [!Equals [!Ref AlarmsSlackChannelHookUrl, '']]
  UseEmailForAlarms:
    !Equals [!Ref AlarmsSlackChannelHookUrl, '']

Resources:
  AlarmsPagerDutySNSTopic:
    Type: AWS::SNS::Topic
    Condition: PagerDutyIntegrationUrlSpecified
    Properties:
      TopicName: "{{cluster_name}}-AlarmsPagerDutySNSTopic"
  
  AlarmsPagerDutySubscription:
    Type: AWS::SNS::Subscription
    Condition: PagerDutyIntegrationUrlSpecified
    Properties:
      RawMessageDelivery: False
      TopicArn: !GetAtt AlarmsPagerDutySNSTopic.TopicArn
      Protocol: HTTPS
      Endpoint: !Ref PagerDutyIntegrationUrl

  SendCWAlarmsToSlackLambdaRole:
    Type: AWS::IAM::Role
    Condition: AlarmsSlackChannelHookUrlSpecified
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: SendCWAlarmsToSlackLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  SendCWAlarmsToSlackLambda:
    Type: AWS::Lambda::Function
    Condition: AlarmsSlackChannelHookUrlSpecified
    Properties:
      Runtime: python3.13
      Role: !GetAtt SendCWAlarmsToSlackLambdaRole.Arn
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          slackUrl: !Ref AlarmsSlackChannelHookUrl        
      Code:
        ZipFile: |
          import urllib3
          import json
          import os

          slack_url = os.environ['slackUrl']
          http = urllib3.PoolManager()

          def get_alarm_attributes(sns_message):
              alarm = dict()

              alarm['name'] = sns_message['AlarmName']
              alarm['description'] = sns_message['AlarmDescription']
              alarm['reason'] = sns_message['NewStateReason']
              alarm['region'] = sns_message['Region']
              alarm['state'] = sns_message['NewStateValue']
              alarm['previous_state'] = sns_message['OldStateValue']
              # Metric-math alarms may list expressions before MetricStat
              # (e.g. os-http-errors SUM). Do not assume Metrics[1] is MetricStat.
              alarm['instance_id'] = None
              for metric in (sns_message.get('Trigger') or {}).get('Metrics') or []:
                  try:
                      alarm['instance_id'] = metric['MetricStat']['Metric']['Dimensions'][0]['value']
                      break
                  except (KeyError, IndexError, TypeError):
                      continue

              return alarm

          def notify_insufficient_data(alarm):
              return {
                  "type": "home",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":warning: INSUFFICIENT_DATA: " + alarm['name']
                          }
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "_" + alarm['description'] + "_"
                          },
                          "block_id": "text1"
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "context",
                          "elements": [
                              {
                                  "type": "mrkdwn",
                                  "text": "Region: *" + alarm['region'] + "*"
                              }
                          ]
                      }
                  ]
              }

          def notify_alarm(alarm):
              return {
                  "type": "home",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":red_circle: ALARM: " + alarm['name']
                          }
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "_" + alarm['reason'] + "_"
                          },
                          "block_id": "text1"
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "context",
                          "elements": [
                              {
                                  "type": "mrkdwn",
                                  "text": "Region: *" + alarm['region'] + "*"
                              }
                          ]
                      }
                  ]
              }

          def notify_ok(alarm):
              return {
                  "type": "home",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":large_green_circle: OK: " + alarm['name']
                          }
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "_" + alarm['reason'] + "_"
                          },
                          "block_id": "text1"
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "context",
                          "elements": [
                              {
                                  "type": "mrkdwn",
                                  "text": "Region: *" + alarm['region'] + "*"
                              }
                          ]
                      }
                  ]
              }

          def notify_generic(message):
              return {
                  "type": "home",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":warning: NOTIFICATION"
                          }
                      },
                      {
                          "type": "divider"
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": message
                          },
                          "block_id": "text1"
                      }
                  ]
              }

          def handler(event, context):
              raw_message = event["Records"][0]["Sns"]["Message"]
              msg = None

              try:
                  sns_message = json.loads(raw_message)
                  if 'AlarmName' in sns_message:
                      alarm = get_alarm_attributes(sns_message)

                      if alarm['state'] == 'INSUFFICIENT_DATA':
                          msg = notify_insufficient_data(alarm)
                      elif alarm['state'] == 'ALARM':
                          msg = notify_alarm(alarm)
                      elif alarm['state'] == 'OK':
                          msg = notify_ok(alarm)
              except (json.JSONDecodeError, KeyError, TypeError, IndexError):
                  pass

              if msg is None:
                  msg = notify_generic(raw_message)

              encoded_msg = json.dumps(msg).encode("utf-8")
              resp = http.request("POST", slack_url, body=encoded_msg)
              print(
                  {
                      "message": msg,
                      "status_code": resp.status,
                      "response": resp.data,
                  }
              )

  AlarmsNotificationSNSTopic:
    Type: AWS::SNS::Topic

  AlarmsSlackSubscription:
    Type: AWS::SNS::Subscription
    Condition: AlarmsSlackChannelHookUrlSpecified
    Properties:
      TopicArn: !Ref AlarmsNotificationSNSTopic
      Protocol: lambda
      Endpoint: !GetAtt SendCWAlarmsToSlackLambda.Arn

  AlarmsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: UseEmailForAlarms
    Properties:
      TopicArn: !Ref AlarmsNotificationSNSTopic
      Protocol: email
      Endpoint: !Ref AlarmsEmailAddress

  SendCWAlarmsToSlackLambdaFunctionInvokePermission:
    Type: 'AWS::Lambda::Permission'
    Condition: AlarmsSlackChannelHookUrlSpecified
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref SendCWAlarmsToSlackLambda
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmsNotificationSNSTopic

  AuthoringPodsDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CloudWatchAlarmsEnabled
    Properties:
      AlarmName: {{client_id}}/{{cluster_name}}/authoring-pods-down
      AlarmDescription: Authoring in {{client_id}}/{{cluster_name}} pod count < 1
      Metrics:
        - Expression: !Sub "IF((DAY(m1) == ${BlackoutWindowDay} AND (HOUR(m1) >= ${BlackoutWindowStartHour} AND HOUR(m1) <= ${BlackoutWindowEndHour})), 1, m1)"
          Id: service_number_of_running_pods
          Period: '60'
          ReturnData: True
        - Id: m1
          ReturnData: False
          MetricStat:
            Metric:
              Dimensions:
                - Name: Namespace
                  Value: craftercms
                - Name: Service
                  Value: authoring-service
                - Name: ClusterName
                  Value: {{cluster_name}}
              MetricName: service_number_of_running_pods
              Namespace: ContainerInsights
            Period: '60'
            Stat: Average
      EvaluationPeriods: '3'
      DatapointsToAlarm: '2'
      ComparisonOperator: LessThanThreshold
      Threshold: '1'
      TreatMissingData: "missing"
      AlarmActions:
        - !Ref AlarmsNotificationSNSTopic
      OKActions: 
        - !Ref AlarmsNotificationSNSTopic

  AuthoringTomcatHighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CloudWatchAlarmsEnabled
    Properties:
      AlarmName: {{client_id}}/{{cluster_name}}/authoring-tomcat-high-memory
      AlarmDescription: Authoring tomcat in {{client_id}}/{{cluster_name}} memory usage is > 95%
      Metrics:
        - Expression: !Sub "IF((DAY(m1) == ${BlackoutWindowDay} AND (HOUR(m1) >= ${BlackoutWindowStartHour} AND HOUR(m1) <= ${BlackoutWindowEndHour})), 1, m1)"
          Id: container_memory_utilization_over_container_limit
          Period: '300'
          ReturnData: True
        - Id: m1
          ReturnData: False
          MetricStat:
            Metric:
              Dimensions:
                - Name: Namespace
                  Value: craftercms
                - Name: ClusterName
                  Value: {{cluster_name}}
                - Name: PodName
                  Value: authoring-0
                - Name: ContainerName
                  Value: tomcat
              MetricName: container_memory_utilization_over_container_limit
              Namespace: ContainerInsights
            Period: '300'
            Stat: Average
      EvaluationPeriods: '1'
      ComparisonOperator: GreaterThanThreshold
      Threshold: '95'
      TreatMissingData: "missing"
      AlarmActions:
        - !Ref AlarmsNotificationSNSTopic
      OKActions:
        - !Ref AlarmsNotificationSNSTopic

