                - Name: ClusterName
                  Value: {{cluster_name}}
                - Name: PodName
                  Value: authoring-0
                - Name: ContainerName
                  Value: deployer
              MetricName: container_memory_utilization_over_container_limit
              Namespace: ContainerInsights
            Period: '300'
            Stat: Average
      EvaluationPeriods: '1'
      ComparisonOperator: GreaterThanThreshold
