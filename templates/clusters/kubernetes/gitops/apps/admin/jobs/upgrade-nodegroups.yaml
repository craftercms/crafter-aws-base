apiVersion: v1
kind: ConfigMap
metadata:
  name: upgrade-nodegroups-script
data:
  upgrade-nodegroups.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    PARALLELISM="${PARALLELISM:-1}"
    if ! [[ "$PARALLELISM" =~ ^[1-9][0-9]*$ ]]; then
      echo "PARALLELISM must be a positive integer, got: ${PARALLELISM}" >&2
      exit 1
    fi

    RESULTS_DIR="$(mktemp -d)"
    NOTIFIED_ON_ERROR=0

    client_cluster() {
      if [[ -n "${CLIENT_ID:-}" ]]; then
        echo "${CLIENT_ID}/${CLUSTER_NAME}"
      else
        echo "${CLUSTER_NAME:-unknown}"
      fi
    }

    send_notification() {
      local status="$1"
      local body="$2"
      echo "Skipping SNS for status ${status} (weekly digest only)"
      return 0
    }

    digest_period() {
      # Next Wednesday's ISO week so Sunday jobs land in that week's digest.
      local dow days
      dow=$(date -u +%u)
      days=$(( (3 - dow + 7) % 7 ))
      if [[ "$days" -eq 0 ]]; then
        days=7
      fi
      date -u -d "+${days} days" +%G-W%V
    }

    upload_summary() {
      local status="$1"
      shift
      local -a item_args=("$@")
      if [[ -z "${OPS_REPORTS_BUCKET:-}" || "${OPS_REPORTS_BUCKET}" == *'{{'* ]]; then
        echo "OPS_REPORTS_BUCKET unset; skip S3 upload"
        return 0
      fi
      local period generated_at key tmp
      period="$(digest_period)"
      generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      tmp="$(mktemp)"
      jq -n \
        --arg client "${CLIENT_ID:-unknown}" \
        --arg account_id "${ACCOUNT_ID:-}" \
        --arg cluster "${CLUSTER_NAME:-unknown}" \
        --arg region "${AWS_REGION:-${AWS_DEFAULT_REGION:-}}" \
        --arg generated_at "$generated_at" \
        --arg period "$period" \
        --arg status "$status" \
        '{
          schema_version: 1,
          client: $client,
          account_id: $account_id,
          cluster: $cluster,
          region: $region,
          report_type: "eks_node_upgrade",
          generated_at: $generated_at,
          period: $period,
          status: $status,
          counts: {fail: 0, success: 0},
          items: []
        }' >"$tmp"
      local name item_status
      while [[ ${#item_args[@]} -gt 0 ]]; do
        name="${item_args[0]}"
        item_status="${item_args[1]}"
        item_args=("${item_args[@]:2}")
        jq --arg name "$name" --arg st "$item_status" \
          '.items += [{name: $name, status: $st, detail: $st}]
           | if $st == "fail" then .counts.fail += 1 else .counts.success += 1 end' \
          "$tmp" >"${tmp}.next"
        mv "${tmp}.next" "$tmp"
      done
      local report_region="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
      if [[ -z "$report_region" ]]; then
        echo "AWS_REGION unset; skip S3 upload" >&2
        rm -f "$tmp"
        return 1
      fi
      key="${period}/${CLIENT_ID:-unknown}/${CLUSTER_NAME}/${report_region}/eks_node_upgrade.json"
      local upload_status=0
      aws s3 cp "$tmp" "s3://${OPS_REPORTS_BUCKET}/${key}" \
        --region "${OPS_REPORTS_BUCKET_REGION:-us-east-1}" \
        --sse AES256 \
        --content-type application/json || upload_status=$?
      rm -f "$tmp"
      if [[ $upload_status -ne 0 ]]; then
        return "$upload_status"
      fi
      echo "Uploaded s3://${OPS_REPORTS_BUCKET}/${key}"
    }

    on_error() {
      local exit_code=$?
      if [[ $NOTIFIED_ON_ERROR -eq 1 ]]; then
        exit "$exit_code"
      fi
      NOTIFIED_ON_ERROR=1
      local report="Weekly nodegroup upgrade failed for $(client_cluster): unexpected error (exit ${exit_code}) at line ${BASH_LINENO[0]:-unknown}."
      echo "$report" >&2
      upload_summary "fail" "job" "fail" || true
      send_notification "failure" "$report" || true
      exit "$exit_code"
    }

    trap 'rm -rf "$RESULTS_DIR"' EXIT
    trap on_error ERR

    export PATH="/opt/eksctl/bin:${PATH}"

    install_tools() {
      dnf install -y -q aws-cli jq findutils
    }

    upgrade_nodegroup() {
      local nodegroup="$1"
      echo "Starting upgrade for nodegroup: ${nodegroup}"
      if eksctl upgrade nodegroup \
        --cluster "$CLUSTER_NAME" \
        --name "$nodegroup" \
        --region "$AWS_REGION"; then
        echo "OK" >"${RESULTS_DIR}/${nodegroup}"
      else
        echo "FAIL" >"${RESULTS_DIR}/${nodegroup}"
      fi
    }

    export -f upgrade_nodegroup
    export CLUSTER_NAME AWS_REGION RESULTS_DIR

    install_tools

    mapfile -t NODEGROUPS < <(
      eksctl get nodegroup \
        --cluster "$CLUSTER_NAME" \
        --region "$AWS_REGION" \
        -o json | jq -r '.[] | select(.Type == "managed") | .Name'
    )

    if [[ ${#NODEGROUPS[@]} -eq 0 || -z "${NODEGROUPS[0]:-}" ]]; then
      report="Weekly nodegroup upgrade failed for $(client_cluster): no managed nodegroups found."
      echo "$report"
      NOTIFIED_ON_ERROR=1
      upload_summary "fail" "managed_nodegroups" "fail" || true
      send_notification "failure" "$report" || true
      exit 1
    fi

    echo "Managed nodegroups to upgrade:"
    printf '  - %s\n' "${NODEGROUPS[@]}"

    printf '%s\n' "${NODEGROUPS[@]}" | xargs -n1 -P"${PARALLELISM}" bash -c 'upgrade_nodegroup "$@"' _

    failures=()
    successes=()
    for nodegroup in "${NODEGROUPS[@]}"; do
      if [[ ! -f "${RESULTS_DIR}/${nodegroup}" ]]; then
        failures+=("${nodegroup}")
        continue
      fi
      if [[ "$(cat "${RESULTS_DIR}/${nodegroup}")" == "FAIL" ]]; then
        failures+=("${nodegroup}")
      else
        successes+=("${nodegroup}")
      fi
    done

    report="Weekly nodegroup upgrade report for $(client_cluster)."
    report+=$(printf '\n\nNodegroups upgraded successfully (%s):' "${#successes[@]}")
    if [[ ${#successes[@]} -gt 0 ]]; then
      report+=$(printf '\n  - %s' "${successes[@]}")
    else
      report+=$'\n  (none)'
    fi
    report+=$(printf '\n\nNodegroups that failed (%s):' "${#failures[@]}")
    if [[ ${#failures[@]} -gt 0 ]]; then
      report+=$(printf '\n  - %s' "${failures[@]}")
    else
      report+=$'\n  (none)'
    fi

    echo "$report"

    summary_args=()
    for nodegroup in "${successes[@]}"; do
      summary_args+=("$nodegroup" "ok")
    done
    for nodegroup in "${failures[@]}"; do
      summary_args+=("$nodegroup" "fail")
    done
    if [[ ${#failures[@]} -gt 0 ]]; then
      upload_summary "fail" "${summary_args[@]}" || true
      NOTIFIED_ON_ERROR=1
      send_notification "failure" "$report" || true
      exit 1
    fi

    upload_summary "ok" "${summary_args[@]}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upgrade-nodegroups
spec:
  schedule: "{{upgrade_nodes_cron}}"
  timeZone: "{{upgrade_nodes_cron_tz}}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 28800
      activeDeadlineSeconds: 7200
      parallelism: 1
      completions: 1
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: upgrade-nodegroups
          restartPolicy: Never
          initContainers:
            # Official eksctl image (public.ecr.aws/eksctl/eksctl) is distroless (only /eksctl, no shell).
            # This orchestration script needs bash + aws-cli + jq, so stage the pinned eksctl binary here.
            # A custom image with all tools pre-baked could drop initContainer/runtime dnf and enable
            # runAsNonRoot/readOnlyRootFilesystem in a follow-up.
            - name: stage-eksctl
              image: public.ecr.aws/docker/library/alpine:3.19
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache curl
                  curl -fsSL "https://github.com/weaveworks/eksctl/releases/download/${EKSCTL_VERSION}/eksctl_Linux_amd64.tar.gz" \
                    | tar xz -C /opt/eksctl/bin eksctl
                  chmod +x /opt/eksctl/bin/eksctl
                  /opt/eksctl/bin/eksctl version
              env:
                - name: EKSCTL_VERSION
                  value: "{{eksctl_version}}"
              volumeMounts:
                - name: eksctl-bin
                  mountPath: /opt/eksctl/bin
          containers:
            - name: upgrade-nodegroups
              image: public.ecr.aws/amazonlinux/amazonlinux:2023
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - /scripts/upgrade-nodegroups.sh
              env:
                - name: CLIENT_ID
                  value: "{{client_id}}"
                - name: CLUSTER_NAME
                  value: "{{cluster_name}}"
                - name: AWS_REGION
                  value: "{{aws_region}}"
                - name: PARALLELISM
                  value: "{{upgrade_nodes_parallelism}}"
                - name: SNS_TOPIC_ARN
                  value: "{{nodegroup_upgrade_sns_topic_arn}}"
                - name: AWS_DEFAULT_REGION
                  value: "{{aws_region}}"
                - name: ACCOUNT_ID
                  value: "{{aws_account_id}}"
                - name: OPS_REPORTS_BUCKET
                  value: "{{ops_reports_bucket}}"
                - name: OPS_REPORTS_BUCKET_REGION
                  value: "{{ops_reports_bucket_region}}"
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: upgrade-nodegroups-script
                  mountPath: /scripts
                  readOnly: true
                - name: eksctl-bin
                  mountPath: /opt/eksctl/bin
                  readOnly: true
          volumes:
            - name: upgrade-nodegroups-script
              configMap:
                name: upgrade-nodegroups-script
                defaultMode: 0755
            - name: eksctl-bin
              emptyDir: {}
